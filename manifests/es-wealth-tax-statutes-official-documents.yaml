      source_note: >-
        Article 3 creates the ITSGF. Its sections Nueve, Diez, Once and Quince
        govern the exemption, 31 December accrual, progressive scale and IP
        quota credit. Extraction targets numeric top-level articles needed for
        this scope; separately suffixed articles are not asserted as
        independently sliced. The law was published 28 December 2022 and
        entered into force 29 December 2022, before the first 31 December
        accrual.
