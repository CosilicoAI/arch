    metadata:
      primary_source: true
      source_authority: Kanton Zürich / Zürcher Gesetzessammlung
      legal_identifier: LS 631.1, Nachtrag 115
      source_family: wealth-tax/zurich-tariff
      source_note: >-
        The official historical-law page records publication on 1 January 2022
        and this version in force through 1 July 2023. The direct official
        WebView PDF is retained from the § 47 heading up to, but not including,
        § 48. Section 47 gives the
        2022 single and married wealth-tax tariff widths, the shared-custody
        married-tariff condition, and the end-of-period status rule. This source
        closes the former 2022-vintage gap; the later ESTV 2026 indexed table
        remains a separate document below.
